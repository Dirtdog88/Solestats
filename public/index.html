<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoleStats · What AI tells runners to buy</title>
<meta name="description" content="A public index of how AI shopping assistants recommend, describe and route sales for running brands. Open method, open data, monthly.">
<link rel="stylesheet" href="/2026-11-21-styles.css">
</head>
<body>
<header class="hero">
  <p class="brand">SoleStats</p>
  <h1>What AI tells runners to buy</h1>
  <form id="lookup" class="lookup" autocomplete="off">
    <label for="q" class="sr-only">Look up a brand</label>
    <input id="q" name="q" type="search" placeholder="Look up a brand, e.g. Brooks" list="brand-list">
    <datalist id="brand-list"></datalist>
    <button type="submit">Look up</button>
  </form>
</header>

<main>
  <section id="shoes">
    <h2>Brands</h2>
    <div id="shoe-table" class="table-wrap"></div>
  </section>

  <section id="retailers">
    <h2>Where the sale goes</h2>
    <div id="retail-table" class="table-wrap"></div>
  </section>

  <section id="data">
    <h2>Downloads</h2>
    <ul id="downloads" class="downloads"></ul>
  </section>

  <section id="engines-section">
    <h2>Engines</h2>
    <p id="edition" class="edition muted"></p>
    <p id="notice" class="notice" hidden></p>
    <ul id="engines" class="engine-list"></ul>
  </section>
</main>

<footer><p><a href="/share.html">Share of voice</a> · <a href="/method.html">Method and definitions</a></p></footer>
<div id="tip" class="tip" role="status" hidden></div>
<script src="/2026-11-21-app.js" type="module"></script>
</body>
</html>
